spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/omar2398/rasid-config-repo.git
          default-label: master
          clone-on-start: true
          force-pull: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info


server:
  port: 8888
